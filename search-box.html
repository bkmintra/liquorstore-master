<!-- Search Box Component -->
<!-- Add this to your navbar in all HTML files -->

<!-- Search Box HTML -->
<div class="search-box-wrapper">
    <form class="search-box-form" id="searchForm">
        <div class="input-group">
            <input 
                type="text" 
                class="form-control search-box-input" 
                id="searchInput" 
                placeholder="Search products..."
                autocomplete="off"
            >
            <div class="input-group-append">
                <button class="btn btn-outline-secondary search-btn" type="submit">
                    <span class="fa fa-search"></span>
                </button>
            </div>
        </div>
        <!-- Search Results Dropdown -->
        <div class="search-results-dropdown" id="searchResults" style="display: none;">
            <div class="search-results-list" id="resultsList"></div>
        </div>
    </form>
</div>

<!-- CSS Styling -->
<style>
.search-box-wrapper {
    flex: 1;
    margin: 0 20px;
    position: relative;
}

.search-box-form {
    width: 100%;
}

.search-box-input {
    background-color: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 8px 15px;
    font-size: 14px;
    color: #333;
    transition: all 0.3s ease;
}

.search-box-input:focus {
    background-color: #fff;
    border-color: #f96d00;
    box-shadow: 0 0 5px rgba(249, 109, 0, 0.3);
    outline: none;
}

.search-btn {
    background-color: transparent;
    border: none;
    color: #f96d00;
    padding: 0 12px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.search-btn:hover {
    color: #ff8c1f;
}

.search-btn:focus {
    box-shadow: none;
}

.search-results-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background-color: #fff;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 5px 5px;
    max-height: 400px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.search-results-list {
    padding: 0;
    margin: 0;
    list-style: none;
}

.search-result-item {
    padding: 12px 15px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

.search-result-item:hover {
    background-color: #f5f5f5;
}

.search-result-item:last-child {
    border-bottom: none;
}

.search-result-link {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: inherit;
    width: 100%;
}

.search-result-img {
    width: 50px;
    height: 50px;
    margin-right: 15px;
    border-radius: 3px;
    background-size: cover;
    background-position: center;
}

.search-result-info h4 {
    margin: 0 0 5px 0;
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.search-result-price {
    color: #f96d00;
    font-weight: 600;
    font-size: 13px;
}

.search-result-category {
    color: #999;
    font-size: 12px;
}

.search-no-results {
    padding: 20px;
    text-align: center;
    color: #999;
}

/* Responsive */
@media (max-width: 768px) {
    .search-box-wrapper {
        margin: 10px 0;
    }
    
    .search-box-input {
        font-size: 13px;
        padding: 6px 10px;
    }
}

@media (max-width: 576px) {
    .search-box-wrapper {
        display: none;
    }
}
</style>

<!-- JavaScript Functionality -->
<script>
// Search Box Functionality
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const searchForm = document.getElementById('searchForm');
    const searchResults = document.getElementById('searchResults');
    const resultsList = document.getElementById('resultsList');

    let allProducts = [];

    // Load products from JSON
    async function loadProducts() {
        try {
            const response = await fetch('./data/products.json');
            if (!response.ok) throw new Error('Failed to load products');
            allProducts = await response.json();
        } catch (error) {
            console.error('Error loading products:', error);
        }
    }

    // Initialize on page load
    loadProducts();

    // Search functionality
    searchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();

        if (query.length === 0) {
            searchResults.style.display = 'none';
            return;
        }

        // Filter products based on query
        const filteredProducts = allProducts.filter(product => {
            return (
                product.name.toLowerCase().includes(query) ||
                product.category.toLowerCase().includes(query)
            );
        });

        // Display results
        displayResults(filteredProducts, query);
    });

    // Display search results
    function displayResults(products, query) {
        resultsList.innerHTML = '';

        if (products.length === 0) {
            resultsList.innerHTML = '<div class="search-no-results">No products found</div>';
            searchResults.style.display = 'block';
            return;
        }

        products.slice(0, 8).forEach(product => {
            const resultItem = document.createElement('div');
            resultItem.className = 'search-result-item';
            
            const priceHtml = product.original_price 
                ? `<span class="search-result-price">$${product.price.toFixed(2)}</span>`
                : `<span class="search-result-price">$${product.price.toFixed(2)}</span>`;

            resultItem.innerHTML = `
                <a href="product-single.html?id=${product.id}" class="search-result-link">
                    <div class="search-result-img" style="background-image: url(${product.image_url});"></div>
                    <div class="search-result-info">
                        <h4>${product.name}</h4>
                        <div class="search-result-category">${product.category}</div>
                        <div>${priceHtml}</div>
                    </div>
                </a>
            `;

            resultsList.appendChild(resultItem);
        });

        searchResults.style.display = 'block';
    }

    // Close results when clicking outside
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.search-box-wrapper')) {
            searchResults.style.display = 'none';
        }
    });

    // Handle form submission
    searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query) {
            // Redirect to products page with search query
            window.location.href = `product.html?search=${encodeURIComponent(query)}`;
        }
    });
});
</script>
